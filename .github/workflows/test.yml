name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint:check

      - name: Run tests
        run: npm test

      - name: Check no var declarations in JS
        run: |
          count=$(grep -rP '\bvar\s' dist/assets/js/ --include='*.js' -l --exclude='sakura.js' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found var declarations in:"
            grep -rP '\bvar\s' dist/assets/js/ --include='*.js' -l --exclude='sakura.js'
            exit 1
          fi
          echo "No var declarations found"

      - name: Validate required files
        run: |
          missing=""
          # 构建产物带内容哈希（base.<hash>.css / app.<hash>.js），用 glob 校验
          for f in komari-theme.json dist/index.html LICENSE; do
            if [ ! -f "$f" ]; then missing="$missing $f"; fi
          done
          if ! ls dist/assets/css/base.*.css dist/assets/css/base.css >/dev/null 2>&1; then missing="$missing base.css"; fi
          if ! ls dist/assets/js/app.*.js dist/assets/js/app.js >/dev/null 2>&1; then missing="$missing app.js"; fi
          if [ -n "$missing" ]; then
            echo "Missing:$missing"
            exit 1
          fi
          echo "All required files present"
