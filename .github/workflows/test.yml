name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint:check

      - name: Run tests
        run: npm test

      - name: Check no var declarations in JS
        run: |
          # sakura 是第三方压缩脚本，文件名带内容哈希（sakura.<hash>.js），用 --exclude-glob 匹配
          count=$(grep -rP '\bvar\s' dist/assets/js/ --include='*.js' --exclude='sakura*' -l | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found var declarations in:"
            grep -rP '\bvar\s' dist/assets/js/ --include='*.js' --exclude='sakura*' -l
            exit 1
          fi
          echo "No var declarations found"

      - name: Validate required files
        run: |
          missing=""
          # 构建产物带内容哈希（base.<hash>.css / app.<hash>.js），用 glob 校验
          for f in komari-theme.json dist/index.html LICENSE; do
            if [ ! -f "$f" ]; then missing="$missing $f"; fi
          done
          # ls 同时列存在与不存在的文件会返回 2，用 find 判断更稳妥
          if [ -z "$(find dist/assets/css -maxdepth 1 -name 'base*.css' -print -quit)" ]; then missing="$missing base.css"; fi
          if [ -z "$(find dist/assets/js -maxdepth 1 -name 'app*.js' -print -quit)" ]; then missing="$missing app.js"; fi
          if [ -n "$missing" ]; then
            echo "Missing:$missing"
            exit 1
          fi
          echo "All required files present"
